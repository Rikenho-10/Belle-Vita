<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belle Vita Fit - Gestión de Clientes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 pb-20">

    <header class="bg-slate-950 p-4 shadow-md border-b border-slate-800 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-xl font-bold tracking-wider">BELLE VITA <span class="text-yellow-500">FIT</span></h1>
        <div class="flex items-center gap-2">
            <select id="selectCliente" onchange="cambiarCliente()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-2 py-1 focus:outline-none focus:border-yellow-500 max-w-[110px] truncate"></select>
            <button onclick="agregarCliente()" class="bg-yellow-500 text-black rounded-full w-8 h-8 font-bold flex items-center justify-center text-lg hover:bg-yellow-400">+</button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <!-- SECCIÓN RUTINAS -->
        <section id="secRutinas">
            <h2 class="text-2xl font-bold text-yellow-500 mb-4 flex items-center gap-2">🏋️‍♀️ Plan Semanal</h2>
            <div id="contenedorRutinas" class="space-y-4"></div>
        </section>

        <!-- SECCIÓN EVALUACIÓN -->
        <section id="secProgreso" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-yellow-500">📉 Evaluación</h2>
                <button id="btnEstado" onclick="alternarEstadoCliente()" class="text-xs px-3 py-1 rounded-full font-bold border transition-colors"></button>
            </div>
            
            <div id="formMedicion" class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 shadow-lg">
                <h3 class="font-bold mb-3 text-white border-b border-slate-700 pb-2">Nueva Medición</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div><label class="text-slate-400 text-xs block mb-1">Peso (kg)</label><input type="number" id="inpPeso" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">Cintura (cm)</label><input type="number" id="inpCintura" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">IMC</label><input type="number" id="inpIMC" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">% Grasa</label><input type="number" id="inpGrasa" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">% Músculo</label><input type="number" id="inpMusculo" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">G. Visceral</label><input type="number" id="inpVisceral" step="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">Metabolismo</label><input type="number" id="inpMetabolismo" step="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                    <div><label class="text-slate-400 text-xs block mb-1">Edad Bio.</label><input type="number" id="inpEdad" step="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></div>
                </div>
                <button onclick="guardarMedicion()" class="w-full bg-yellow-500 text-slate-900 font-bold py-3 rounded-lg uppercase tracking-wide">Guardar</button>
            </div>

            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                <div class="bg-slate-900 px-4 py-3 font-bold border-b border-slate-700 text-slate-300 italic" id="msgEstado">Historial</div>
                <div id="historialEvaluaciones" class="divide-y divide-slate-700"></div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-slate-950 border-t border-slate-800 flex justify-around p-3 z-20">
        <button onclick="cambiarPestana('rutinas')" class="text-yellow-500 font-bold flex flex-col items-center"><span class="text-xl">🏋️‍♀️</span><span class="text-xs">Rutinas</span></button>
        <button onclick="cambiarPestana('progreso')" class="text-slate-400 hover:text-yellow-500 font-bold flex flex-col items-center"><span class="text-xl">📉</span><span class="text-xs">Evaluación</span></button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
